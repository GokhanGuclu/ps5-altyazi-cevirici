<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Altyazı</title>
<!--
  OBS Tarayici kaynagi icin Turkce altyazi sayfasi.
  Iki sekilde eklenebilir:
    1. Yerel dosya (onerilen): OBS'te "Yerel dosya" isaretlenip bu dosya secilir.
       Uygulama sonradan acilsa ya da yeniden baslasa bile sayfa kendiliginden baglanir.
    2. Adres: http://127.0.0.1:8765 (uygulama acikken)
  Gorunum (boyut, konum, renk, arka plan) uygulamadaki "Gorunum" penceresinden ayarlanir.
  Uygulama farkli bir portta calisiyorsa adres: altyazi_sayfasi.html?port=8766
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #box { position: absolute; bottom: var(--bottom); left: 50%; transform: translateX(-50%);
         width: max-content; max-width: 88%; text-align: center;
         font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; color: var(--color);
         font-size: var(--size); line-height: 1.25; }
  /* Koyu kutu, alttaki orijinal (Ingilizce) altyaziyi orter. */
  #box:not(:empty) { background: rgba(0, 0, 0, var(--bg)); border-radius: .35em; padding: .3em .6em; }
  .line { display: block; paint-order: stroke fill; -webkit-text-stroke: var(--stroke) #000;
          text-shadow: var(--shadow); animation: in .12s ease-out; }
  .prev { font-size: .78em; opacity: .6; margin-bottom: .2em; }
  .name { color: var(--name-color); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="box"></div>
<script>
  // Gorunum, uygulamadaki "Gorunum" penceresinden gelir. Adreste verilen degerler
  // (?size=46&bottom=14&bg=0.8&color=ffffff) uygulamadakini ezer.
  const q = new URLSearchParams(location.search);
  const root = document.documentElement.style;
  const DEFAULTS = { size: 46, bottom: 14, bg: 0.8, color: '#ffffff', name_color: '#f2c94c', outline: true };
  function applyStyle(style) {
    const s = { ...DEFAULTS, ...(style || {}) };
    for (const key of ['size', 'bottom', 'bg']) if (q.has(key)) s[key] = +q.get(key);
    for (const key of ['color', 'name_color']) if (q.has(key)) s[key] = '#' + q.get(key).replace('#', '');
    root.setProperty('--size', s.size + 'px');
    root.setProperty('--bottom', s.bottom + 'vh');
    root.setProperty('--bg', s.bg);
    root.setProperty('--color', s.color);
    root.setProperty('--name-color', s.name_color);
    root.setProperty('--stroke', s.outline ? Math.max(2, Math.round(s.size / (s.bg > 0.5 ? 14 : 7))) + 'px' : '0px');
    root.setProperty('--shadow', s.outline ? '0 2px 6px rgba(0,0,0,.8)' : 'none');
  }
  applyStyle();
  const box = document.getElementById('box');
  const SPEAKER = /^((?:[A-Z][\w'.-]*\s?){1,3}):\s*(.+)$/;
  let shown = [];
  function render(lines) {
    if (JSON.stringify(lines) === JSON.stringify(shown)) return;
    box.replaceChildren(...lines.map((text, i) => {
      const el = document.createElement('span');
      el.className = 'line' + (i < lines.length - 1 ? ' prev' : '');
      // "Dutch: ..." -> ad ayri renkte gosterilir.
      const m = text.match(SPEAKER);
      if (m) {
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = m[1].trim() + ': ';
        el.append(name, m[2]);
      } else {
        el.textContent = text;
      }
      // Ayni satir guncelleniyorsa (harf harf beliren yazi) gecis animasyonu tekrarlanmasin.
      if (shown.includes(text) || (i === lines.length - 1 && shown.length && text.startsWith(shown[shown.length - 1].slice(0, 8)))) el.style.animation = 'none';
      return el;
    }));
    shown = lines;
  }
  // Sayfa uygulamanin kendi sunucusundan acilmadiysa (OBS yerel dosyalari file:// ile degil
  // http://absolute/... adresiyle acar) uygulamaya tam adresle baglanilir. Uygulama kapaliysa
  // ya da yeniden baslatildiysa birkac saniyede bir tekrar denenir; OBS'te sayfayi yenilemek gerekmez.
  const port = q.get('port') || 8765;
  const fromApp = ['127.0.0.1', 'localhost'].includes(location.hostname) && location.port === String(port);
  const events_url = (fromApp ? '' : 'http://127.0.0.1:' + port) + '/events';
  function connect() {
    const events = new EventSource(events_url);
    events.onmessage = e => {
      const data = JSON.parse(e.data);
      applyStyle(data.style);
      render(data.lines || []);
    };
    events.onerror = () => {
      if (events.readyState === EventSource.CLOSED) {
        events.close();
        setTimeout(connect, 2000);
      }
    };
  }
  connect();
</script>
</body>
</html>
